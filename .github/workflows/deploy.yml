name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @workspace/api-server run build

      - name: Build Frontend
        run: PORT=8082 BASE_PATH=/ pnpm --filter @workspace/travel-agency run build

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 46.225.6.147
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            REPO=/root/gestionaire-agence-de-voyage/gestionaire-agence-de-voyage
            cd $REPO
            git pull origin main

            # نسخ ملفات البناء المرفوعة
            mkdir -p /var/www/travel/artifacts/travel-agency/dist/public
            cp -r artifacts/travel-agency/dist/public/* /var/www/travel/artifacts/travel-agency/dist/public/
            cp -r artifacts/api-server/dist/* /root/.travel-api-dist/ 2>/dev/null || true

            # إعادة تشغيل الـ API
            pm2 restart travel-api || \
              DATABASE_URL=postgresql://travel:StrongPass123@localhost:5432/travel_agency \
              NODE_ENV=production PORT=8082 \
              pm2 start artifacts/api-server/dist/index.mjs \
              --name travel-api --node-args="--enable-source-maps"
            pm2 save

            echo "✅ Deploy complete"
